<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>致敬信</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            min-height: 100%;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        /* ★ 整个页面背景：白色 → 浅蓝渐变 */
        body {
            background: linear-gradient(135deg,
                #ffffff 0%,
                #f0f8fb 30%,
                #d8eef5 60%,
                #b8e0ec 85%,
                #a0d4e4 100%);
            background-attachment: fixed;
        }

        /* 整个场景：宽度固定，高度由内容撑开 */
        .scene {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        /* 背景图（整张信纸图） */
        .bg-img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* 文字层：绝对定位到图片内的浅色信纸区域 */
        .text-layer {
            position: absolute;
            top: 15.5%;
            left: 4.5%;
            width: 91%;
            padding: 10px 20px 30px 20px;
            color: #2c3e50;
            font-size: 19.2px;
            line-height: 2.0;
            overflow: visible;
        }

        .paragraph {
            text-indent: 2em;
            margin: 0 0 8px 0;
            color: #2c3e50;
        }

        .char {
            opacity: 0;
            animation: fadeIn 0.05s forwards;
            display: inline;
        }
        .char.bold {
            color: #2c3e50;
            font-weight: 700;
        }
        .char.white {
            color: #2c3e50;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: #1e4e6b;
            animation: blink 0.7s step-end infinite;
            vertical-align: text-bottom;
            margin-left: 2px;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 响应式 */
        @media (max-width: 640px) {
            .text-layer {
                font-size: 16px;
                line-height: 1.9;
                padding: 8px 14px 24px 14px;
            }
        }
        @media (max-width: 400px) {
            .text-layer {
                font-size: 15px;
                line-height: 1.8;
                padding: 6px 12px 20px 12px;
            }
        }
    </style>
</head>
<body>

<div class="scene">
    <!-- ★★★ 整张信纸图作为背景 ★★★ -->
    <img class="bg-img" src="paper.png" alt="致敬信信纸">

    <!-- 文字层：绝对定位到浅色信纸区域内 -->
    <div class="text-layer" id="letterContent"></div>
</div>

<script>
(function() {
    // ---------- 致敬信定稿全文 ----------
    const paragraphs = [
        { text: '亲爱的员工朋友们：', noIndent: true },
        { text: '大家好！' },
        { text: '秋酿启序，习酒飘香；实干笃行，华章日新。今天，我们召开2027年度生产·质量大会，系统总结过去一年的工作，共同壁画新一年的发展蓝图。在此，公司党委、经营班子向辛勤耕耘在生产、质量一线的员工致以亲切的问候，向默默奋进在各条工作战线上的全体员工表达最诚挚的感谢！' },
        { text: '回望过去一年，挑战与机遇并存，压力与动力同在。全体习酒人承压前行、迎难而上，牢牢守住了发展基本盘，稳稳迈出高质量发展新步伐。[[党建引领强根基]]。坚持把党建引领贯穿企业发展全过程，将组织优势转化为精工艺、提品质、促创新的实干动能，让党旗在车间班组高高飘扬，让先锋在攻坚前沿熠熠生辉，为习酒行稳致远筑牢根本保障。[[匠心守正铸品质]]。传承千年酿造技艺，顺应节令时序，端午制曲不误一时，重阳下沙不省一工，于寒来暑往的专注中雕琢工序细节，在日复一日的坚守中夯实品质基础。[[创新驱动提质效]]。坚持守正创新，加速推动生产标准化落地、数字化迭代、智能化升级，让古老技艺焕发时代光彩，让传统酿造插上科技翅膀，持续拓宽习酒“优质优产”特色生产道路。[[人才赋能筑高地]]。统筹人才储备库建设，搭建人才成长平台，以慧眼识才选贤任能，以雅量容才聚智聚力，让各类人才在习酒干事有舞台、成长有空间、发展有未来，实现企业与员工发展共进、价值共创、成果共享。[[文化聚力践初心]]。将君品文化融入岗位实践，心怀善念、行有善举，在平凡岗位上履职尽责、在急难险重任务前挺身而出，把个人奋斗融入企业发展大局，彰显习酒人向上向善的精神风貌。' },
        { text: '[[一路霜雪皆成酿，半卷光阴自带香]]' },
        { text: '回望来路，[[是你们]]，以信仰为灯，将红色基因融入血脉，让先锋旗帜在各条战线高高飘扬；[[是你们]]，以匠心为尺，将严谨贯穿每道工序，让佳酿在岁月窖藏中愈显醇香；[[是你们]]，以创新为翼，将智慧融入工艺攻关，让品质在技术突破中稳步提升；[[是你们]]，以笃学为梯，将钻研融入岗位日常，让技艺在千锤百炼中绽放光彩；[[是你们]]，以善念为怀，将温情浸润细微之处，让君品文化在润物无声中根植人心。在此，向每一位奋力拼搏的习酒人，致以崇高的敬意！' },
        { text: '[[枸酱千年留味在，习酒今朝启新程]]' },
        { text: '展望未来，[[让我们]]，“跬步不休，千里可至”的韧劲，在生产工作中提质增效、创新突破，奏响生产新乐章；[[让我们]]，“毫厘必较，微瑕不放”的较真，在质量管控上精雕细刻、追求卓越，擦亮质量硬招牌；[[让我们]]，“同舟共济，众篙齐撑”的合力，在全局任务中主动补位、勇挑重担，为“东方习酒、享誉全球”的壮阔图景持续发力！' },
        { text: '过去一年，感谢大家的辛勤奉献。' },
        { text: '新的一年，让我们同心聚力，携手共创习酒更加辉煌的明天！' },
        { text: '贵州习酒股份有限公司', noIndent: true, alignRight: true },
        { text: '2026年10月9日', noIndent: true, alignRight: true }
    ];

    const container = document.getElementById('letterContent');
    container.innerHTML = '';

    const paragraphElements = [];
    paragraphs.forEach(p => {
        const div = document.createElement('div');
        div.className = 'paragraph';
        if (p.noIndent) div.style.textIndent = '0';
        if (p.alignRight) div.style.textAlign = 'right';
        container.appendChild(div);
        paragraphElements.push(div);
    });

    function parseParagraph(text) {
        const chars = [];
        let i = 0;
        let isBold = false;
        while (i < text.length) {
            if (text.substring(i, i + 2) === '[[') {
                isBold = true;
                i += 2;
                continue;
            }
            if (text.substring(i, i + 2) === ']]') {
                isBold = false;
                i += 2;
                continue;
            }
            chars.push({ char: text[i], bold: isBold });
            i++;
        }
        return chars;
    }

    const queue = [];
    paragraphs.forEach((p, pi) => {
        const chars = parseParagraph(p.text);
        chars.forEach(c => {
            queue.push({ char: c.char, bold: c.bold, paragraphIndex: pi });
        });
    });

    const total = queue.length;
    const TARGET_TIME = 8000;
    const baseDelay = Math.max(4, Math.floor(TARGET_TIME / total));

    let idx = 0;
    let cursorSpan = null;

    function removeCursor() {
        if (cursorSpan && cursorSpan.parentNode) {
            cursorSpan.parentNode.removeChild(cursorSpan);
        }
        cursorSpan = null;
    }

    function typeNext() {
        if (idx >= total) {
            removeCursor();
            return;
        }

        const item = queue[idx];
        const span = document.createElement('span');
        span.className = 'char ' + (item.bold ? 'bold' : 'white');
        span.textContent = item.char;
        span.style.animationDuration = '0.05s';

        const paraEl = paragraphElements[item.paragraphIndex];
        paraEl.appendChild(span);

        removeCursor();
        cursorSpan = document.createElement('span');
        cursorSpan.className = 'cursor';
        paraEl.appendChild(cursorSpan);

        idx++;

        if (idx < total) {
            let delay = baseDelay;
            const nextCh = queue[idx].char;
            if (['，', '。', '；', '！', '？', '、', '：'].includes(nextCh)) {
                delay += 2;
            }
            setTimeout(typeNext, delay);
        } else {
            setTimeout(removeCursor, 120);
        }
    }

    setTimeout(typeNext, 200);
})();
</script>
</body>
</html>
